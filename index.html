<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SvenDLC — Чит для Minecraft 1.16.5 / 1.21.4 / 1.21.1</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: #fff; overflow-x: hidden; }
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        .noise { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: repeating-radial-gradient(circle at 20% 30%, rgba(0,0,0,0.2), rgba(0,0,0,0.2) 2px, transparent 2px, transparent 4px); pointer-events: none; z-index: 1; }
        .content { position: relative; z-index: 2; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(2px); padding-top: 80px; }
        .navbar { position: fixed; top: 0; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 16px 40px; background: rgba(10,10,20,0.8); backdrop-filter: blur(12px); z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.1); box-sizing: border-box; }
        .nav-logo { display: flex; align-items: center; gap: 12px; font-size: 1.5rem; font-weight: 800; background: linear-gradient(45deg, #fff, #ff4b2b); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .nav-logo i { color: #ff4b2b; background: none; }
        .nav-links { display: flex; gap: 32px; }
        .nav-link { color: #fff; text-decoration: none; font-weight: 500; transition: all 0.2s cubic-bezier(0.2,0.9,0.4,1.1); padding: 8px 0; cursor: pointer; }
        .nav-link:hover { color: #ff4b2b; transform: translateY(-3px) scale(1.02); }
        .nav-icons { display: flex; gap: 20px; }
        .nav-icon { color: #fff; font-size: 1.4rem; cursor: pointer; transition: all 0.2s cubic-bezier(0.2,0.9,0.4,1.1); width: 40px; text-align: center; }
        .nav-icon:hover { color: #ff4b2b; transform: translateY(-3px) scale(1.1); }
        .version-selector { display: flex; gap: 20px; margin: 30px 0; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 60px; backdrop-filter: blur(5px); }
        .version-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); padding: 10px 24px; border-radius: 40px; color: white; cursor: pointer; font-weight: bold; transition: all 0.2s ease; }
        .version-btn.active { background: linear-gradient(45deg, #ff416c, #ff4b2b); border-color: transparent; box-shadow: 0 0 15px rgba(255,75,43,0.5); }
        .version-btn:hover { transform: translateY(-3px); }
        .glitch { font-size: 6rem; font-weight: 800; text-transform: uppercase; text-align: center; background: linear-gradient(45deg, #ffffff, #ff4b2b, #ff416c); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 3s linear infinite; }
        @keyframes shine { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
        .btn { padding: 14px 32px; font-size: 1rem; font-weight: 600; border: none; border-radius: 40px; cursor: pointer; transition: all 0.2s cubic-bezier(0.2,0.9,0.4,1.1); font-family: inherit; }
        .btn-primary { background: linear-gradient(45deg, #ff416c, #ff4b2b); color: white; box-shadow: 0 4px 15px rgba(255,75,43,0.3); }
        .btn-primary:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 8px 25px rgba(255,75,43,0.5); }
        .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .feature-card { background: rgba(20,20,40,0.6); backdrop-filter: blur(10px); border-radius: 24px; padding: 30px; transition: all 0.25s cubic-bezier(0.2,0.9,0.4,1.1); border: 1px solid rgba(255,255,255,0.1); text-align: center; cursor: pointer; }
        .feature-card:hover { transform: translateY(-8px) scale(1.02); border-color: rgba(255,75,43,0.5); }
        .feature-card i { font-size: 3rem; margin-bottom: 20px; background: linear-gradient(45deg, #ff416c, #ff4b2b); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .modal { display: none; position: fixed; z-index: 200; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); align-items: center; justify-content: center; }
        .modal-content { background: #1a1a2e; padding: 32px; border-radius: 24px; width: 90%; max-width: 450px; border: 1px solid rgba(255,255,255,0.2); }
        .profile-field { margin: 10px 0; padding: 8px; background: #2a2a3e; border-radius: 12px; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #2a2a3e; border: 1px solid #3a3a4e; border-radius: 12px; color: white; }
        .btn-modal { width: 100%; padding: 12px; background: linear-gradient(45deg, #ff416c, #ff4b2b); border: none; border-radius: 40px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .close { float: right; font-size: 28px; cursor: pointer; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(0,0,0,0.8); padding: 12px 24px; border-radius: 40px; transition: transform 0.3s ease; z-index: 100; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        @media (max-width: 768px) { .glitch { font-size: 2.5rem; } .nav-links { display: none; } }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div class="noise"></div>

    <nav class="navbar">
        <div class="nav-logo"><i class="fas fa-skull"></i><span>SvenDLC</span></div>
        <div class="nav-links">
            <a class="nav-link" data-page="home">Главная</a>
            <a class="nav-link" data-page="features">Возможности</a>
            <a class="nav-link" data-page="download">Скачать</a>
        </div>
        <div class="nav-icons">
            <a class="nav-icon" id="supportBtn"><i class="fas fa-headset"></i></a>
            <div class="nav-icon" id="userBtn"><i class="fas fa-user"></i></div>
        </div>
    </nav>

    <div id="supportModal" class="modal"><div class="modal-content"><span class="close">&times;</span><h2>Поддержка</h2><p>Telegram: @svendlc</p><p>Discord: discord.gg/svendlc</p></div></div>
    
    <div id="authModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="authForm">
                <h2 id="authTitle">Вход</h2>
                <input type="text" id="authLogin" placeholder="Логин">
                <input type="email" id="authEmail" placeholder="Email">
                <input type="password" id="authPassword" placeholder="Пароль">
                <button id="authSubmitBtn" class="btn-modal">Войти</button>
                <p id="authMessage"></p>
                <button id="authToggleBtn" class="btn-modal" style="background:transparent;">Нет аккаунта? Регистрация</button>
            </div>
            <div id="profileInfo" style="display:none;">
                <h2>Профиль</h2>
                <div class="profile-field"><strong>UID:</strong> <span id="profileUid"></span></div>
                <div class="profile-field"><strong>Логин:</strong> <span id="profileLogin"></span></div>
                <div class="profile-field"><strong>Email:</strong> <span id="profileEmail"></span></div>
                <div class="profile-field"><strong>Группа:</strong> <span id="profileGroup"></span></div>
                <div class="profile-field"><strong>Подписка до:</strong> <span id="profileExpires"></span></div>
                <div class="profile-field"><strong>HWID:</strong> <span id="profileHwid"></span></div>
                <input type="text" id="licenseKeyInput" placeholder="Введите ключ активации">
                <button id="activateLicenseBtn" class="btn-modal">Активировать ключ</button>
                <button id="logoutBtn" class="btn-modal" style="background:#333;">Выйти</button>
            </div>
        </div>
    </div>

    <div id="adminModal" class="modal"><div class="modal-content"><span class="close">&times;</span><h2>Админ-панель</h2><input type="password" id="adminPass" placeholder="Пароль"><button id="adminLoginBtn" class="btn-modal">Войти</button><div id="adminPanel" style="display:none; margin-top:20px;"><h3>Генерация ключа</h3><select id="keyVersion"><option value="1.16.5">Версия 1.16.5</option><option value="1.21.4">Версия 1.21.4</option><option value="1.21.1">Версия 1.21.1</option></select><button id="genKeyBtn" class="btn-modal">Создать ключ</button><p id="newKeyDisplay" style="margin-top:10px;"></p></div></div></div>

    <div id="mainContent" class="content"></div>
    <div id="toast" class="toast"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // === API URL ===
        const API_URL = 'https://svendlc-api.svendlc.workers.dev';
        
        // === Глобальные переменные ===
        let currentUser = null;
        let selectedVersion = localStorage.getItem('selectedVersion') || '1.16.5';
        let isLoginMode = true;

        // === 3D ФОН ===
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg-canvas'), alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        const geometry = new THREE.TorusGeometry(8, 2, 64, 200);
        const material = new THREE.MeshStandardMaterial({ color: 0xff3366, emissive: 0x441122 });
        const torus = new THREE.Mesh(geometry, material);
        scene.add(torus);
        const particlesGeo = new THREE.BufferGeometry();
        const posArray = new Float32Array(1500 * 3);
        for(let i = 0; i < 1500 * 3; i += 3) { posArray[i] = (Math.random() - 0.5) * 200; posArray[i+1] = (Math.random() - 0.5) * 100; posArray[i+2] = (Math.random() - 0.5) * 100; }
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particles = new THREE.Points(particlesGeo, new THREE.PointsMaterial({ color: 0xff4b2b, size: 0.2, transparent: true, blending: THREE.AdditiveBlending }));
        scene.add(particles);
        const light = new THREE.PointLight(0xff4b2b, 1); light.position.set(10, 10, 10); scene.add(light);
        scene.add(new THREE.AmbientLight(0x222222));
        camera.position.z = 30;
        function animate() { requestAnimationFrame(animate); torus.rotation.x += 0.003; torus.rotation.y += 0.005; particles.rotation.y += 0.0005; renderer.render(scene, camera); }
        animate();
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

        // === Функции ===
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.background = isError ? 'rgba(255,50,50,0.9)' : 'rgba(0,0,0,0.8)';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        async function loadPage(page) {
            const container = document.getElementById('mainContent');
            if(page === 'home') {
                container.innerHTML = `<div class="hero" style="text-align:center;"><h1 class="glitch">SvenDLC</h1><p class="tagline">Премиум чит для Minecraft</p>
                <div class="version-selector"><button data-ver="1.16.5" class="version-btn ${selectedVersion === '1.16.5' ? 'active' : ''}">1.16.5</button><button data-ver="1.21.4" class="version-btn ${selectedVersion === '1.21.4' ? 'active' : ''}">1.21.4</button><button data-ver="1.21.1" class="version-btn ${selectedVersion === '1.21.1' ? 'active' : ''}">1.21.1</button></div>
                <div class="hero-buttons"><button class="btn btn-primary" id="downloadMainBtn"><i class="fas fa-download"></i> Скачать ${selectedVersion}</button><button class="btn btn-secondary" id="featuresMainBtn">Возможности</button></div></div>`;
                document.querySelectorAll('.version-btn').forEach(btn => btn.onclick = () => { selectedVersion = btn.dataset.ver; localStorage.setItem('selectedVersion', selectedVersion); loadPage('home'); });
                document.getElementById('downloadMainBtn').onclick = () => showToast(`Скачивание SvenDLC для ${selectedVersion}...`);
                document.getElementById('featuresMainBtn').onclick = () => loadPage('features');
            } else if(page === 'features') {
                container.innerHTML = `<div class="features"><h2>Возможности</h2><div class="features-grid">
                <div class="feature-card"><i class="fas fa-shield-alt"></i><h3>Анти-бан</h3><p>Обход серверной защиты</p></div>
                <div class="feature-card"><i class="fas fa-tachometer-alt"></i><h3>2000+ FPS</h3><p>Оптимизация</p></div>
                <div class="feature-card"><i class="fas fa-eye"></i><h3>ESP / X-Ray</h3><p>Подсветка игроков</p></div>
                <div class="feature-card"><i class="fas fa-crosshairs"></i><h3>Aimbot</h3><p>Наведение</p></div>
                </div></div>`;
            } else if(page === 'download') {
                container.innerHTML = `<div class="download-section" style="text-align:center;"><div class="feature-card" style="max-width:400px;"><i class="fas fa-download" style="font-size:4rem;"></i><h2>Скачать SvenDLC</h2><p>Версия: ${selectedVersion}</p><button class="btn btn-primary" id="realDownloadBtn">Скачать JAR</button></div></div>`;
                document.getElementById('realDownloadBtn').onclick = () => showToast(`Скачивание SvenDLC ${selectedVersion}...`);
            }
        }

        async function updateProfileUI() {
            if(currentUser) {
                document.getElementById('profileUid').innerText = currentUser.uid;
                document.getElementById('profileLogin').innerText = currentUser.login;
                document.getElementById('profileEmail').innerText = currentUser.email;
                document.getElementById('profileGroup').innerText = currentUser.group_name || 'user';
                let expiresText = 'Нет';
                if(currentUser.license_expires) {
                    const expDate = new Date(currentUser.license_expires * 1000);
                    const days = Math.ceil((currentUser.license_expires * 1000 - Date.now()) / 86400000);
                    expiresText = `${days} дней (до ${expDate.toLocaleDateString()})`;
                }
                document.getElementById('profileExpires').innerText = expiresText;
                document.getElementById('profileHwid').innerText = currentUser.hwid || 'Не привязан';
                document.getElementById('authForm').style.display = 'none';
                document.getElementById('profileInfo').style.display = 'block';
                document.getElementById('userBtn').style.color = '#ff4b2b';
            } else {
                document.getElementById('authForm').style.display = 'block';
                document.getElementById('profileInfo').style.display = 'none';
                document.getElementById('userBtn').style.color = '#fff';
            }
        }

        // === API ВЫЗОВЫ ===
        async function register(login, email, password) {
            const res = await fetch(`${API_URL}/api/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ login, email, password })
            });
            return res.json();
        }

        async function login(login, password) {
            const res = await fetch(`${API_URL}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ login, password })
            });
            return res.json();
        }

        async function activateKey(uid, key) {
            const res = await fetch(`${API_URL}/api/activate`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ uid, key })
            });
            return res.json();
        }

        async function adminGenerateKey(adminKey, version, days) {
            const res = await fetch(`${API_URL}/api/admin/generate`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminKey, version, days })
            });
            return res.json();
        }

        // === Обработчики ===
        document.getElementById('authToggleBtn').onclick = () => {
            isLoginMode = !isLoginMode;
            document.getElementById('authTitle').innerText = isLoginMode ? 'Вход' : 'Регистрация';
            document.getElementById('authSubmitBtn').innerText = isLoginMode ? 'Войти' : 'Зарегистрироваться';
        };

        document.getElementById('authSubmitBtn').onclick = async () => {
            const loginVal = document.getElementById('authLogin').value.trim();
            const emailVal = document.getElementById('authEmail').value.trim();
            const passVal = document.getElementById('authPassword').value;
            
            if(isLoginMode) {
                const res = await login(loginVal, passVal);
                if(res.success) {
                    currentUser = res.user;
                    localStorage.setItem('svendlc_current_user', JSON.stringify(currentUser));
                    updateProfileUI();
                    document.getElementById('authModal').style.display = 'none';
                    showToast(`Добро пожаловать, ${currentUser.login}!`);
                    loadPage('home');
                } else {
                    document.getElementById('authMessage').innerText = res.error;
                }
            } else {
                if(!loginVal || !emailVal || !passVal) {
                    document.getElementById('authMessage').innerText = 'Заполните все поля';
                    return;
                }
                const res = await register(loginVal, emailVal, passVal);
                if(res.success) {
                    const loginRes = await login(loginVal, passVal);
                    if(loginRes.success) {
                        currentUser = loginRes.user;
                        localStorage.setItem('svendlc_current_user', JSON.stringify(currentUser));
                        updateProfileUI();
                        document.getElementById('authModal').style.display = 'none';
                        showToast('Регистрация успешна!');
                        loadPage('home');
                    }
                } else {
                    document.getElementById('authMessage').innerText = res.error;
                }
            }
        };

        document.getElementById('activateLicenseBtn').onclick = async () => {
            const key = document.getElementById('licenseKeyInput').value.trim();
            if(!key) { showToast('Введите ключ', true); return; }
            if(!currentUser) { showToast('Вы не авторизованы', true); return; }
            const res = await activateKey(currentUser.uid, key);
            if(res.success) {
                currentUser.license_expires = res.expires_at;
                currentUser.group_name = 'premium';
                localStorage.setItem('svendlc_current_user', JSON.stringify(currentUser));
                updateProfileUI();
                showToast('Ключ активирован!');
                document.getElementById('licenseKeyInput').value = '';
            } else {
                showToast(res.error, true);
            }
        };

        document.getElementById('logoutBtn').onclick = () => {
            localStorage.removeItem('svendlc_current_user');
            currentUser = null;
            updateProfileUI();
            document.getElementById('authModal').style.display = 'none';
            showToast('Вы вышли');
            loadPage('home');
        };

        // Админка
        document.addEventListener('keydown', (e) => { if(e.shiftKey && e.key === 'A') document.getElementById('adminModal').style.display = 'flex'; });
        document.getElementById('adminLoginBtn').onclick = async () => {
            const pass = document.getElementById('adminPass').value;
            if(pass === 'svenadmin') {
                document.getElementById('adminPanel').style.display = 'block';
                document.getElementById('adminLoginBtn').style.display = 'none';
                showToast('Добро пожаловать в админ-панель');
            } else {
                showToast('Неверный пароль', true);
            }
        };
        document.getElementById('genKeyBtn').onclick = async () => {
            const version = document.getElementById('keyVersion').value;
            const res = await adminGenerateKey('svenadmin', version, 30);
            if(res.success) {
                document.getElementById('newKeyDisplay').innerHTML = `<strong>Ключ для ${version}:</strong><br><code style="background:#000;padding:5px;">${res.key}</code>`;
                showToast(`Ключ создан!`);
            } else {
                showToast(res.error, true);
            }
        };

        // Инициализация
        const storedUser = localStorage.getItem('svendlc_current_user');
        if(storedUser) { currentUser = JSON.parse(storedUser); updateProfileUI(); }
        
        document.querySelectorAll('.nav-link').forEach(link => link.onclick = (e) => { e.preventDefault(); loadPage(link.dataset.page); });
        document.getElementById('supportBtn').onclick = (e) => { e.preventDefault(); document.getElementById('supportModal').style.display = 'flex'; };
        document.getElementById('userBtn').onclick = () => { updateProfileUI(); document.getElementById('authModal').style.display = 'flex'; };
        document.querySelectorAll('.close').forEach(btn => btn.onclick = () => { document.getElementById('supportModal').style.display = 'none'; document.getElementById('authModal').style.display = 'none'; document.getElementById('adminModal').style.display = 'none'; });
        window.onclick = (e) => { if(e.target.classList.contains('modal')) e.target.style.display = 'none'; };
        
        loadPage('home');
    </script>
</body>
</html>
