<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SvenDLC — Чит для Minecraft 1.16.5</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div class="noise"></div>

    <!-- ШАПКА (navbar) -->
    <nav class="navbar">
        <div class="nav-logo">
            <i class="fas fa-skull"></i>
            <span>SvenDLC</span>
        </div>
        <div class="nav-links">
            <a href="#" class="nav-link" data-page="home">Главная</a>
            <a href="#" class="nav-link" data-page="features">Возможности</a>
            <a href="#" class="nav-link" data-page="download">Скачать</a>
        </div>
        <div class="nav-icons">
            <a href="#" class="nav-icon" id="supportBtn">
                <i class="fas fa-headset"></i>
            </a>
            <div class="nav-icon user-icon" id="userBtn">
                <i class="fas fa-user"></i>
            </div>
        </div>
    </nav>

    <!-- МОДАЛКА ПОДДЕРЖКИ -->
    <div id="supportModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Поддержка</h2>
            <p>Напишите нам на почту: <strong>support@svendlc.ru</strong></p>
            <p>Telegram: <strong>@svendlc_support</strong></p>
            <p>Discord: <strong>discord.gg/svendlc</strong></p>
        </div>
    </div>

    <!-- МОДАЛКА ПРОФИЛЯ / АВТОРИЗАЦИИ -->
    <div id="authModal" class="modal">
        <div class="modal-content auth-content">
            <span class="close">&times;</span>
            <div id="authForm">
                <h2>Вход / Регистрация</h2>
                <input type="email" id="authEmail" placeholder="Email" autocomplete="email">
                <input type="password" id="authPassword" placeholder="Пароль" autocomplete="current-password">
                <button id="authSubmitBtn" class="btn-modal">Войти</button>
                <p id="authMessage"></p>
            </div>
            <div id="profileInfo" style="display: none;">
                <h2>Профиль</h2>
                <p><strong>Email:</strong> <span id="profileEmail"></span></p>
                <p><strong>Статус:</strong> <span id="profileStatus">Premium</span></p>
                <button id="logoutBtn" class="btn-modal">Выйти</button>
            </div>
        </div>
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ (меняется динамически) -->
    <div class="content" id="mainContent">
        <!-- Контент будет подставляться через JS -->
    </div>

    <div id="toast" class="toast"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
